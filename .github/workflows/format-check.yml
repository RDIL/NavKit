name: Code Formatting Check

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ClangFormat
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Verify Formatting
        run: |
          # Keep this exclusion list in sync with QUALITY_SOURCES in CMakeLists.txt.
          # Find files and run clang-format in dry-run mode.
          # --Werror forces a non-zero exit code if formatting violations are found.
          clang-format-18 --version
          find src/ include/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) |
            grep -Ev 'vcpkg_cached_data|build|vcpkg|extern|simdjson|swfmill|stb_truetype|ConcurrentQueue|easywsclient|QuickDigest|ResourceLib_HM3|RecastDemo' |
            xargs clang-format-18 --dry-run --Werror -style=file
